services:
  agent:
    build: ./agent
    image: agent:dev
    ports:
      - "${AGENT_PORT:?AGENT_PORT is not set}:4000"
    environment:
      PORT: 4000
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_MODEL: ${AI_MODEL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
  connector:
    build: ./connector
    image: connector:dev
    ports:
      - "${CONNECTOR_PORT:?CONNECTOR_PORT is not set}:5000"
    environment:
      PORT: 5000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped