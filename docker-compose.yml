services:
  agent:
    build: ./agent
    image: agent:dev
    ports:
      - "${AGENT_PORT:?AGENT_PORT is not set}:4000"
    environment:
      PORT: 4000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped